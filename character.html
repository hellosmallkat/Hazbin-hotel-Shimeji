<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customise Your Shimeji</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #1a0b0b;
      color: #f3d9b1;
      margin: 0;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }
    #symbols-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .room-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: inherit;
      text-decoration: none;
      font-weight: 600;
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      transition: color 0.3s;
    }
    .preview-wrapper {
      display: inline-block;
      overflow: hidden;
      border-radius: 28px;
      max-width: 450px;
      margin: 1rem 0 2.5rem 0;
      box-shadow: 0 0 40px rgba(0,0,0,0.7), 0 0 80px var(--accent-color, #c7923e);
      border: 3px solid var(--accent-color, #c7923e);
      transition: border-color 0.5s;
    }
    .preview-wrapper img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.2s ease-out;
      transform-origin: top left;
    }
    .vibe-section {
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      border: 2px solid var(--accent-color, #c7923e);
      border-radius: 28px;
      padding: 2rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 0 35px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }
    .vibe-quote {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-style: italic;
      margin-bottom: 1rem;
      color: var(--accent-color);
      text-shadow: 0 0 15px currentColor;
    }
    .vibe-desc {
      font-size: 1.1rem;
      line-height: 1.7;
    }
    .control-panel {
      background: rgba(20,20,20,0.85);
      border: 2px solid var(--accent-color);
      border-radius: 28px;
      padding: 2.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    .slider-group {
      display: flex;
      flex-wrap: wrap;
      gap: 2.5rem;
      align-items: center;
      margin: 1.5rem 0;
    }
    .slider-item label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-family: 'Playfair Display', serif;
      color: var(--accent-color);
      font-size: 1.1rem;
    }
    input[type="range"] {
      width: 240px;
      height: 8px;
      accent-color: var(--accent-color);
      border-radius: 4px;
    }
    .summon-button {
      display: inline-block;
      padding: 1.2rem 3.5rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      border-radius: 60px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 2px;
      transition: all 0.3s;
      margin-top: 1.5rem;
      background: var(--button-bg, linear-gradient(45deg, #8b3a1a, #d47b2a));
      color: #fff;
      border: 3px solid var(--accent-color);
      box-shadow: 0 0 25px var(--accent-color);
      text-shadow: 0 0 8px rgba(0,0,0,0.6);
    }
    .summon-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 45px var(--accent-color);
      filter: brightness(1.2);
    }
  </style>
</head>
<body>
  <div id="symbols-container"></div>

  <div class="room-container">
    <a href="index.html" class="back-link" id="backLink">Back to the Hotel</a>
    <h1 id="charName" style="font-family:'Playfair Display'; font-size:3rem; margin-bottom:0.5rem; text-shadow:0 0 20px currentColor;">Loading...</h1>

    <!-- Live scaling preview -->
    <div class="preview-wrapper" id="previewWrapper">
      <img id="charPreview" src="" alt="" />
    </div>

    <!-- Vibe section (above controls) -->
    <div id="vibeSection" class="vibe-section" style="display:none;">
      <p class="vibe-quote" id="vibeQuote"></p>
      <p class="vibe-desc" id="vibeDesc"></p>
    </div>

    <!-- Controls -->
    <div id="customPanel" style="display:none;">
      <div class="control-panel" id="controlPanel">
        <div class="slider-group">
          <div class="slider-item">
            <label>Size: <span id="sizeValue">1.0</span></label>
            <input type="range" id="sizeSlider" min="0.5" max="2.0" step="0.1" value="1.0">
          </div>
          <div class="slider-item">
            <label>Duplicates: <span id="countValue">1</span></label>
            <input type="range" id="countSlider" min="1" max="10" step="1" value="1">
          </div>
        </div>
        <button class="summon-button" id="summonBtn">Summon Chaos</button>
        <p style="margin-top:0.8rem; opacity:0.8;">Downloads a custom ZIP with your settings</p>
      </div>
    </div>
    <div id="errorMsg" style="color:red; display:none;"></div>
  </div>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const charId = params.get('char');
      if (!charId) { showError('No character selected. Return to the main page.'); return; }

      try {
        const res = await fetch('../characters.json');
        const allChars = await res.json();
        const char = allChars.find(c => c.id === charId);
        if (!char) throw new Error('Character not found.');

        applyRoomTheme(char.room);

        document.getElementById('charName').textContent = char.name;
        const previewImg = document.getElementById('charPreview');
        previewImg.src = '../' + char.preview;
        previewImg.alt = char.name;
        document.getElementById('customPanel').style.display = 'block';

        if (char.vibe) {
          document.getElementById('vibeSection').style.display = 'block';
          document.getElementById('vibeQuote').textContent = char.vibe.quote;
          document.getElementById('vibeDesc').textContent = char.vibe.description;
        }

        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const countSlider = document.getElementById('countSlider');
        const countValue = document.getElementById('countValue');

        function updatePreviewSize(scale) {
          previewImg.style.transform = `scale(${scale})`;
        }

        sizeSlider.addEventListener('input', () => {
          const val = parseFloat(sizeSlider.value).toFixed(1);
          sizeValue.textContent = val;
          updatePreviewSize(parseFloat(val));
        });
        countSlider.addEventListener('input', () => {
          countValue.textContent = countSlider.value;
        });

        // Initial preview at 1.0
        updatePreviewSize(1.0);

        document.getElementById('summonBtn').addEventListener('click', async () => {
          const scale = parseFloat(sizeSlider.value);
          const count = parseInt(countSlider.value, 10);
          await generateAndDownload(char, scale, count);
        });

      } catch (err) { showError(err.message); }
    })();

    function applyRoomTheme(room) {
      document.body.style.background = room.pattern || room.bg;
      document.body.style.backgroundColor = room.bg;
      document.body.style.color = room.text;

      document.documentElement.style.setProperty('--accent-color', room.accent);
      document.documentElement.style.setProperty('--button-bg', room.button);

      const backLink = document.getElementById('backLink');
      backLink.style.color = room.accent;

      document.getElementById('charName').style.color = room.heading;

      const panel = document.getElementById('controlPanel');
      panel.style.background = room.cardBg;
      panel.style.borderColor = room.accent;

      const vibe = document.getElementById('vibeSection');
      if (vibe) vibe.style.borderColor = room.accent;

      // Floating symbols
      const container = document.getElementById('symbols-container');
      container.innerHTML = '';
      if (room.backgroundSymbols) {
        room.backgroundSymbols.forEach(sym => {
          for (let i = 0; i < 8; i++) {
            const span = document.createElement('span');
            span.textContent = sym.symbol;
            span.style.cssText = `position:absolute; left:${Math.random()*95}%; top:${Math.random()*95}%; font-size:${sym.size}; color:${sym.color}; opacity:${sym.opacity}; pointer-events:none; user-select:none;`;
            container.appendChild(span);
          }
        });
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.style.display = 'block';
      el.textContent = msg;
    }

    async function generateAndDownload(char, scale, count) {
      const zipUrl = '../' + char.zip;
      const resp = await fetch(zipUrl);
      const blob = await resp.blob();
      const zip = await JSZip.loadAsync(blob);

      let configFile = zip.file('conf/設定.properties') || zip.file('conf/Actions.properties');
      if (!configFile) {
        const confs = Object.keys(zip.files).filter(f => f.startsWith('conf/') && f.endsWith('.properties'));
        if (confs.length) configFile = zip.file(confs[0]);
      }

      if (configFile) {
        let text = await configFile.async('text');
        text = setOrReplace(text, 'OnScreenCount', count.toString());
        text = setOrReplace(text, 'Scale', scale.toFixed(1));
        zip.file(configFile.name, text);
      }

      const newZip = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(newZip);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${char.name}_Shimeji_custom.zip`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    function setOrReplace(text, key, val) {
      const lines = text.split('\n');
      let found = false;
      const updated = lines.map(line => {
        if (line.trim().startsWith(key + '=') || line.trim().startsWith(key + ' ')) {
          found = true;
          return `${key}=${val}`;
        }
        return line;
      });
      if (!found) updated.push(`${key}=${val}`);
      return updated.join('\n');
    }
  </script>
</body>
</html>
